save_print:
  name: Save print
  description: Save or update a completed Snapmaker U1 print in persistent storage.
  fields:
    printer_id:
      required: true
      selector:
        text:
    print_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    status:
      selector:
        select:
          options:
            - completed
            - cancelled
            - failed
    image_url:
      selector:
        text:
    duration_seconds:
      selector:
        number:
          min: 0
          mode: box
    electricity_cost:
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    material_cost:
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    max_entries:
      selector:
        number:
          min: 1
          max: 200
          mode: box
