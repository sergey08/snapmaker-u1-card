name: HACS validation

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: Validate dashboard card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          comment: false
