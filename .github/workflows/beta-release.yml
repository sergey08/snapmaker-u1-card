name: Publish beta release

on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing beta tag to repair/publish'
        required: true
        default: 'v0.1.0-beta.1'
        type: string

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and HACS metadata
        run: |
          node --check snapmaker-u1-card.js
          node tests/validate-card.cjs
      - name: Require real screenshots for public beta
        run: |
          for file in card-full.png card-compact.png setup-wizard.png spoolman-inventory.png; do
            test -s "assets/screenshots/$file" || { echo "::error::Missing assets/screenshots/$file"; exit 1; }
            file "assets/screenshots/$file" | grep -q "PNG image data" || { echo "::error::Invalid PNG: $file"; exit 1; }
          done
      - name: Validate screenshot dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          names = ("card-full.png", "card-compact.png", "setup-wizard.png", "spoolman-inventory.png")
          for name in names:
              data = (Path("assets/screenshots") / name).read_bytes()
              assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), f"{name}: invalid PNG signature"
              assert data[12:16] == b"IHDR", f"{name}: missing PNG IHDR"
              width, height = struct.unpack(">II", data[16:24])
              assert width >= 250 and height >= 250, f"{name}: screenshot too small ({width}x{height})"
              print(f"{name}: {width}x{height} OK")
          PY
      - name: Publish prerelease after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > /tmp/snapmaker-u1-release-notes.md <<'NOTES'
          ## Español

          Primera beta pública de **Snapmaker U1 Card**, una tarjeta para Home Assistant dedicada a la impresora Snapmaker U1.

          **Incluye:** monitorización de cuatro cabezales (T0–T3), temperaturas, progreso y trabajo actual, cámara opcional, filamentos e inventario Spoolman, consumo eléctrico, controles de impresión, editor visual y asistente de configuración con detección de entidades.

          **Instalación:** en HACS, añade `https://github.com/sergey08/snapmaker-u1-card` como repositorio personalizado de tipo **Dashboard**. Instala la tarjeta y añade `type: custom:snapmaker-u1-card` a tu panel.

          **Importante:** es una beta. Comprueba las entidades detectadas antes de utilizar los controles de impresión. Moonraker y Lava son necesarios para la experiencia completa; Spoolman es opcional.

          ## English

          First public beta of **Snapmaker U1 Card**, a Home Assistant dashboard card for the Snapmaker U1 printer.

          **Features:** four toolheads (T0–T3), temperatures, progress and current job, optional camera, filament and Spoolman inventory, electricity monitoring, printer controls, visual editor, and an entity auto-detection setup wizard.

          **Installation:** add `https://github.com/sergey08/snapmaker-u1-card` to HACS as a custom **Dashboard** repository. Install it and add `type: custom:snapmaker-u1-card` to your dashboard.

          **Note:** this is a beta. Verify entity mappings before using printer controls. Moonraker and Lava are required for the full experience; Spoolman is optional.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Snapmaker U1 Card $TAG" --prerelease --notes-file /tmp/snapmaker-u1-release-notes.md
            gh release upload "$TAG" snapmaker-u1-card.js --clobber
          else
            gh release create "$TAG" snapmaker-u1-card.js \
              --title "Snapmaker U1 Card $TAG" \
              --prerelease \
              --notes-file /tmp/snapmaker-u1-release-notes.md
          fi
