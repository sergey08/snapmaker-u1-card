name: Validate Snapmaker U1 Card

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check snapmaker-u1-card.js
      - name: Validate HACS metadata
        run: |
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("hacs.json","utf8"));if(h.filename!=="snapmaker-u1-card.js"||!h.content_in_root)process.exit(1);console.log("HACS metadata OK")'
      - name: Verify required files
        run: test -s README.md && test -s LICENSE && test -s snapmaker-u1-card.js
