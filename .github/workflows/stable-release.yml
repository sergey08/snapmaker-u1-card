name: Publish stable release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/stable-release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version tag (e.g. v0.1.1)'
        required: true
        default: 'v0.1.2'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check stable version
        env:
          VERSION: ${{ inputs.version || 'v0.1.2' }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Stable version must look like v0.1.0"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate card
        run: |
          node --check snapmaker-u1-card.js
          node tests/validate-card.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('hacs.json').read_text())
          assert h['filename']=='snapmaker-u1-card.js'
          assert Path(h['filename']).is_file()
          for name in ('card-full.png','card-compact.png','setup-wizard.png','spoolman-inventory.png'):
              assert (Path('assets/screenshots')/name).stat().st_size>0
          PY
      - name: Publish GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || 'v0.1.2' }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; refusing to overwrite a stable release"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists; refusing to move it"
            exit 1
          fi
          if [ "$VERSION" = "v0.1.2" ]; then
            cp RELEASE_NOTES_v0.1.2.md /tmp/release-notes.md
          else
            echo "::error::Add reviewed bilingual release notes before publishing $VERSION"
            exit 1
          fi
          gh release create "$VERSION" snapmaker-u1-card.js \
            --target "$GITHUB_SHA" \
            --title "Snapmaker U1 Card $VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest
