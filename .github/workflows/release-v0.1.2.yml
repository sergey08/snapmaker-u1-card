name: Publish Snapmaker U1 Card v0.1.3
on:
  push:
    paths:
      - '.github/workflows/release-v0.1.3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v0.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.3 >/dev/null 2>&1; then
            echo "Release v0.1.3 already exists."
            exit 0
          fi
          gh release create v0.1.3 --target "$GITHUB_SHA" --title "Snapmaker U1 Card v0.1.3" --notes-file RELEASE_NOTES_v0.1.2.md --latest
