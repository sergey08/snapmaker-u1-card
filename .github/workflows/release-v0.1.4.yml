name: Publish Snapmaker U1 Card v0.1.4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate card
        run: |
          node --check snapmaker-u1-card.js
          node tests/validate-card.cjs
      - name: Publish stable v0.1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.4 >/dev/null 2>&1; then
            echo "Release v0.1.4 already exists."
            exit 0
          fi
          gh release create v0.1.4 snapmaker-u1-card.js \
            --target "$GITHUB_SHA" \
            --title "Snapmaker U1 Card v0.1.4" \
            --notes-file RELEASE_NOTES_v0.1.4.md \
            --latest
